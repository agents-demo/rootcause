<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="plastic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a2a7ae"/>
      <stop offset=".4" stop-color="#7b8088"/>
      <stop offset=".75" stop-color="#585d64"/>
      <stop offset="1" stop-color="#3c4046"/>
    </linearGradient>
    <linearGradient id="plastic2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4b9c0"/>
      <stop offset=".5" stop-color="#878c94"/>
      <stop offset="1" stop-color="#5d626a"/>
    </linearGradient>
    <radialGradient id="plight" cx=".3" cy=".2" r=".8">
      <stop offset="0" stop-color="#dfe4ea" stop-opacity=".4"/>
      <stop offset="1" stop-color="#0a0b0d" stop-opacity="0"/>
    </radialGradient>
    <filter id="pnoise">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer>
    </filter>
    <filter id="psoft"><feGaussianBlur stdDeviation="7"/></filter>
    <pattern id="ribs" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-opacity=".03"/>
    </pattern>
  </defs>
  <rect width="1000" height="620" fill="#101114"/>
  <ellipse cx="500" cy="310" rx="500" ry="300" fill="#1a1c20"/>
  <ellipse cx="380" cy="220" rx="330" ry="230" fill="url(#plight)"/>

  <g>
    <rect x="118" y="96" width="764" height="440" rx="34" fill="#191b1f" opacity=".9" filter="url(#psoft)"/>
    <rect x="126" y="88" width="748" height="440" rx="32" fill="url(#plastic)"/>
    <rect x="126" y="88" width="748" height="440" rx="32" fill="url(#ribs)"/>
    <rect x="126" y="88" width="748" height="440" rx="32" filter="url(#pnoise)" opacity=".7"/>
    <rect x="158" y="120" width="684" height="376" rx="22" fill="none" stroke="#d5dae0" stroke-opacity=".18" stroke-width="1.5"/>
    <rect x="158" y="120" width="684" height="376" rx="22" fill="none" stroke="#2f3339" stroke-opacity=".5" stroke-width="2"/>

    <!-- bosses -->
    <g>
      <circle cx="250" cy="200" r="44" fill="url(#plastic2)" stroke="#d9dee4" stroke-opacity=".2"/>
      <circle cx="250" cy="200" r="24" fill="#2a2e34" stroke="#a9afb7" stroke-opacity=".35"/>
      <circle cx="770" cy="200" r="44" fill="url(#plastic2)" stroke="#d9dee4" stroke-opacity=".2"/>
      <circle cx="770" cy="200" r="24" fill="#2a2e34" stroke="#a9afb7" stroke-opacity=".35"/>
      <circle cx="250" cy="430" r="36" fill="url(#plastic2)" stroke="#d9dee4" stroke-opacity=".18"/>
      <circle cx="250" cy="430" r="19" fill="#2a2e34" stroke="#a9afb7" stroke-opacity=".3"/>
    </g>

    <!-- ribs -->
    <g>
      <path d="M400 160 L400 450" stroke="#6b7078" stroke-width="26"/>
      <path d="M400 160 L400 450" stroke="#c7ccd3" stroke-opacity=".25" stroke-width="2"/>
      <path d="M500 160 L500 450" stroke="#6b7078" stroke-width="24"/>
      <path d="M500 160 L500 450" stroke="#c7ccd3" stroke-opacity=".22" stroke-width="2"/>
      <path d="M600 160 L600 450" stroke="#6b7078" stroke-width="22"/>
      <path d="M600 160 L600 450" stroke="#c7ccd3" stroke-opacity=".18" stroke-width="2"/>
      <path d="M660 300 L790 300" stroke="#6b7078" stroke-width="20"/>
      <path d="M660 300 L790 300" stroke="#d4d9df" stroke-opacity=".2" stroke-width="2"/>
    </g>

    <!-- short shot: unfilled rib 4 -->
    <g>
      <path d="M526 292 L610 292 L610 376 L556 398 L526 362 Z" fill="#23262b"/>
      <path d="M526 292 C560 296 592 294 610 292" fill="none" stroke="#1a1d21" stroke-width="3"/>
      <path d="M532 300 C548 320 552 342 548 364" fill="none" stroke="#9aa0a8" stroke-opacity=".2" stroke-width="1"/>
      <path d="M610 292 L610 376" stroke="#d8dde3" stroke-opacity=".28" stroke-width="1.5"/>
      <path d="M610 376 L556 398 L526 362" fill="none" stroke="#d8dde3" stroke-opacity=".14" stroke-width="1.2"/>
    </g>

    <!-- scratches -->
    <g stroke="#e7ecf1" stroke-opacity=".1" fill="none">
      <path d="M190 350 L340 344"/>
      <path d="M620 140 L730 148"/>
      <path d="M660 430 L760 424"/>
    </g>
    <rect x="126" y="88" width="748" height="440" rx="32" fill="none" stroke="#eef2f5" stroke-opacity=".14"/>
  </g>
</svg>
