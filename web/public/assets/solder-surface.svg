<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f5a4b"/>
      <stop offset=".45" stop-color="#174639"/>
      <stop offset="1" stop-color="#0e2e27"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f46"/>
      <stop offset="1" stop-color="#181b1f"/>
    </linearGradient>
    <radialGradient id="voidg" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f8fffd" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#c7f8ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <filter id="pblur"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="pnoise2">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="41"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer>
    </filter>
    <pattern id="traces" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 13 H26" stroke="#c8a35a" stroke-opacity=".13" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1000" height="620" fill="#0a1411"/>
  <rect x="40" y="40" width="920" height="540" rx="8" fill="url(#pcb)"/>
  <rect x="40" y="40" width="920" height="540" rx="8" fill="url(#traces)"/>
  <rect x="40" y="40" width="920" height="540" rx="8" filter="url(#pnoise2)" opacity=".7"/>
  <rect x="40" y="40" width="920" height="540" rx="8" fill="none" stroke="#5eead4" stroke-opacity=".12"/>

  <!-- board details -->
  <g stroke="#c8a35a" stroke-opacity=".28" fill="none">
    <path d="M90 110 H250 V220 H340"/>
    <path d="M90 500 H280 V420 H390"/>
    <path d="M720 110 H900 V300"/>
    <path d="M720 500 H900 V420 H760"/>
    <path d="M150 300 H280 V350"/>
  </g>
  <g fill="#c8a35a" opacity=".3">
    <circle cx="90" cy="110" r="6"/><circle cx="340" cy="220" r="5"/>
    <circle cx="280" cy="420" r="5"/><circle cx="900" cy="300" r="6"/>
  </g>
  <g fill="#0f2a24" stroke="#4e7c6e" stroke-opacity=".35">
    <rect x="120" y="150" width="80" height="46" rx="3"/>
    <rect x="120" y="380" width="56" height="80" rx="3"/>
    <rect x="790" y="360" width="70" height="60" rx="3"/>
  </g>

  <!-- QFN package -->
  <g>
    <rect x="366" y="196" width="268" height="228" rx="6" fill="#080b0a" opacity=".7" filter="url(#pblur)"/>
    <rect x="366" y="196" width="268" height="228" rx="6" fill="url(#chip)" stroke="#7f8b93" stroke-opacity=".3"/>
    <g fill="#b9c2c8" opacity=".55">
      <rect x="382" y="204" width="6" height="14"/><rect x="398" y="204" width="6" height="14"/>
      <rect x="414" y="204" width="6" height="14"/><rect x="430" y="204" width="6" height="14"/>
      <rect x="446" y="204" width="6" height="14"/><rect x="462" y="204" width="6" height="14"/>
      <rect x="478" y="204" width="6" height="14"/><rect x="494" y="204" width="6" height="14"/>
      <rect x="510" y="204" width="6" height="14"/><rect x="526" y="204" width="6" height="14"/>
      <rect x="542" y="204" width="6" height="14"/><rect x="558" y="204" width="6" height="14"/>
      <rect x="574" y="204" width="6" height="14"/><rect x="590" y="204" width="6" height="14"/>
      <rect x="382" y="402" width="6" height="14"/><rect x="398" y="402" width="6" height="14"/>
      <rect x="414" y="402" width="6" height="14"/><rect x="430" y="402" width="6" height="14"/>
      <rect x="446" y="402" width="6" height="14"/><rect x="462" y="402" width="6" height="14"/>
      <rect x="478" y="402" width="6" height="14"/><rect x="494" y="402" width="6" height="14"/>
      <rect x="510" y="402" width="6" height="14"/><rect x="526" y="402" width="6" height="14"/>
      <rect x="542" y="402" width="6" height="14"/><rect x="558" y="402" width="6" height="14"/>
      <rect x="574" y="402" width="6" height="14"/><rect x="590" y="402" width="6" height="14"/>
      <rect x="374" y="230" width="14" height="6"/><rect x="374" y="250" width="14" height="6"/>
      <rect x="374" y="270" width="14" height="6"/><rect x="374" y="290" width="14" height="6"/>
      <rect x="374" y="310" width="14" height="6"/><rect x="374" y="330" width="14" height="6"/>
      <rect x="374" y="350" width="14" height="6"/><rect x="374" y="370" width="14" height="6"/>
      <rect x="612" y="230" width="14" height="6"/><rect x="612" y="250" width="14" height="6"/>
      <rect x="612" y="270" width="14" height="6"/><rect x="612" y="290" width="14" height="6"/>
      <rect x="612" y="310" width="14" height="6"/><rect x="612" y="330" width="14" height="6"/>
      <rect x="612" y="350" width="14" height="6"/><rect x="612" y="370" width="14" height="6"/>
    </g>
    <text x="500" y="316" text-anchor="middle" font-family="monospace" font-size="12" fill="#9aa6ad" opacity=".45" letter-spacing="2">QFN-32</text>
    <circle cx="382" cy="212" r="4" fill="#5eead4" opacity=".35"/>
  </g>

  <!-- x-ray void overlay under thermal pad -->
  <g opacity=".85">
    <ellipse cx="500" cy="310" rx="96" ry="86" fill="#5eead4" opacity=".07" filter="url(#pblur)"/>
    <circle cx="470" cy="292" r="26" fill="url(#voidg)"/>
    <circle cx="518" cy="320" r="34" fill="url(#voidg)"/>
    <circle cx="492" cy="352" r="18" fill="url(#voidg)"/>
    <circle cx="544" cy="282" r="12" fill="url(#voidg)"/>
    <circle cx="444" cy="332" r="11" fill="url(#voidg)"/>
    <circle cx="536" cy="358" r="9" fill="url(#voidg)"/>
  </g>
  <g fill="none" stroke="#d9fff8" stroke-opacity=".45">
    <circle cx="518" cy="320" r="34" stroke-width=".8"/>
    <circle cx="470" cy="292" r="26" stroke-width=".7"/>
  </g>
  <text x="700" y="560" font-family="monospace" font-size="8" fill="#9fe9dc" opacity=".45">XR-04 · 31% void · limit 25%</text>
</svg>
