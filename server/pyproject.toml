[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rootcause"
version = "0.9.0"
description = "Evidence-first root cause analysis and quality reports for factories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "Pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
opcua = ["asyncua>=1.0"]
modbus = ["pymodbus>=3.6"]
npu = ["onnxruntime>=1.17"]
connectors = ["asyncua>=1.0", "pymodbus>=3.6", "python-snap7>=1.3"]
pdf = ["reportlab>=4"]
docx = ["python-docx>=1.1"]
s7 = ["python-snap7>=1.3"]
train = ["ultralytics>=8.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
rootcause-api = "rootcause.api.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["rootcause*"]

[tool.setuptools.package-data]
rootcause = ["data/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
