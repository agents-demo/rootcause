name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "./server[dev,pdf,docx]"
      - name: Lint
        run: ruff check server
      - name: Tests
        run: pytest -q
        working-directory: server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Type-check and build
        run: npm run build
        working-directory: web
      - name: Verify offline pack
        run: |
          test -f web/dist/demo-pack.json
          test -f web/dist/assets/bracket-surface.svg
